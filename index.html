<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="用手指或滑鼠寫一個數字，讓類神經網路猜猜看。" />
    <title>Digits Recognizer</title>
    <link rel="icon" href="/logo.ico" sizes="any" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body
    class="min-h-dvh bg-slate-950 font-sans text-slate-100 antialiased selection:bg-indigo-500/40"
  >
    <div
      x-data="digitsRecognizer"
      @keydown.enter.window.prevent="run()"
      @keydown.escape.window="clear()"
      class="relative mx-auto flex min-h-dvh max-w-4xl flex-col px-4 py-6 sm:py-10"
    >
      <!-- background glow -->
      <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-0 overflow-hidden">
        <div
          class="absolute -top-40 left-1/2 h-96 w-[40rem] -translate-x-1/2 rounded-full bg-indigo-600/25 blur-3xl"
        ></div>
        <div
          class="absolute -bottom-40 right-0 h-80 w-80 rounded-full bg-fuchsia-600/15 blur-3xl"
        ></div>
      </div>

      <header class="relative mb-6 text-center sm:mb-10">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">來數幾類</h1>
        <p class="mt-2 text-sm text-slate-400">
          寫一個數字 <span class="font-mono text-slate-300">0–9</span>，讓類神經網路猜猜看
        </p>
      </header>

      <main class="relative grid flex-1 items-start gap-6 md:grid-cols-[auto_1fr]">
        <!-- drawing pad -->
        <section class="mx-auto w-full max-w-[320px]">
          <div
            class="relative aspect-square overflow-hidden rounded-2xl bg-white shadow-2xl shadow-indigo-950/50 ring-1 ring-white/10"
          >
            <canvas
              x-ref="canvas"
              :width="size"
              :height="size"
              @pointerdown.prevent="start($event)"
              @pointermove="move($event)"
              @pointerup="end()"
              @pointercancel="end()"
              @pointerleave="end()"
              class="block h-full w-full cursor-crosshair touch-none"
              aria-label="手寫數字畫布"
            ></canvas>

            <!-- placeholder -->
            <div
              x-show="!hasInk && status === 'ready'"
              x-transition.opacity
              class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center gap-2 text-slate-300"
            >
              <svg
                class="size-10"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"
                />
              </svg>
              <span class="text-sm">在這裡寫數字</span>
            </div>

            <!-- loading / error overlay -->
            <div
              x-show="status !== 'ready'"
              x-transition.opacity.duration.300ms
              class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-slate-900/85 text-sm backdrop-blur-sm"
            >
              <template x-if="status === 'loading'">
                <div class="flex flex-col items-center gap-3 text-slate-300">
                  <span
                    class="size-8 animate-spin rounded-full border-2 border-slate-600 border-t-indigo-400"
                  ></span>
                  <span>模型載入中…</span>
                </div>
              </template>
              <template x-if="status === 'error'">
                <div class="flex flex-col items-center gap-3 px-6 text-center text-rose-300">
                  <span>模型載入失敗，請重新整理頁面。</span>
                  <button
                    @click="location.reload()"
                    class="rounded-lg bg-white/10 px-3 py-1.5 text-white hover:bg-white/20"
                  >
                    重新整理
                  </button>
                </div>
              </template>
            </div>
          </div>

          <div class="mt-4 grid grid-cols-2 gap-3">
            <button
              type="button"
              @click="clear()"
              :disabled="!hasInk"
              class="rounded-xl bg-white/5 px-4 py-3 font-medium text-slate-200 ring-1 ring-white/10 transition hover:bg-white/10 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-40"
            >
              清除
            </button>
            <button
              type="button"
              @click="run()"
              :disabled="status !== 'ready' || busy"
              class="flex items-center justify-center gap-2 rounded-xl bg-indigo-500 px-4 py-3 font-semibold text-white shadow-lg shadow-indigo-500/30 transition hover:bg-indigo-400 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50"
            >
              <span
                x-show="busy"
                x-cloak
                class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
              ></span>
              <span>辨識</span>
            </button>
          </div>

          <p
            x-show="message"
            x-cloak
            x-transition
            x-text="message"
            role="alert"
            class="mt-3 rounded-lg bg-amber-500/10 px-3 py-2 text-center text-sm text-amber-300 ring-1 ring-amber-500/20"
          ></p>

          <p class="mt-3 hidden text-center text-xs text-slate-500 sm:block">
            <kbd class="rounded bg-white/10 px-1.5 py-0.5 font-mono">Enter</kbd> 辨識 ·
            <kbd class="rounded bg-white/10 px-1.5 py-0.5 font-mono">Esc</kbd> 清除
          </p>
        </section>

        <!-- result -->
        <section
          class="rounded-2xl bg-white/[0.03] p-5 ring-1 ring-white/10 backdrop-blur"
          aria-live="polite"
        >
          <div class="flex items-center gap-5">
            <div
              class="flex size-24 shrink-0 items-center justify-center rounded-2xl bg-indigo-500/10 ring-1 ring-indigo-400/30"
            >
              <template x-for="d in digit === null ? [] : [digit]" :key="d">
                <span
                  class="animate-pop font-mono text-6xl font-bold text-indigo-300"
                  x-text="d"
                ></span>
              </template>
              <span x-show="digit === null" class="font-mono text-5xl text-slate-600">?</span>
            </div>
            <div>
              <p class="text-sm text-slate-400">辨識結果</p>
              <p
                class="mt-1 text-lg font-semibold"
                x-text="digit === null ? '尚未辨識' : `看起來像 ${digit}`"
              ></p>
              <p x-show="digit !== null" x-cloak class="text-sm text-slate-400">
                信心度
                <span class="font-mono text-slate-200" x-text="pct(probs[digit] ?? 0)"></span>
              </p>
            </div>
          </div>

          <ul class="mt-6 space-y-2">
            <template x-for="(p, i) in probs" :key="i">
              <li class="grid grid-cols-[1.25rem_1fr_3.5rem] items-center gap-3 text-sm">
                <span
                  class="font-mono"
                  :class="i === digit ? 'font-bold text-indigo-300' : 'text-slate-400'"
                  x-text="i"
                ></span>
                <div class="h-2.5 overflow-hidden rounded-full bg-white/5">
                  <div
                    class="h-full rounded-full transition-[width] duration-500 ease-out"
                    :class="i === digit ? 'bg-gradient-to-r from-indigo-500 to-fuchsia-400' : 'bg-slate-500/60'"
                    :style="`width: ${p * 100}%`"
                  ></div>
                </div>
                <span
                  class="text-right font-mono text-xs tabular-nums text-slate-500"
                  x-text="pct(p)"
                ></span>
              </li>
            </template>
          </ul>
        </section>
      </main>

      <footer class="relative mt-10 text-center text-xs text-slate-500">
        模型建構：<a
          class="text-slate-400 underline-offset-2 hover:text-slate-200 hover:underline"
          href="https://github.com/tnfsh810124"
          target="_blank"
          rel="noopener"
          >@tnfsh810124</a
        >
        ·
        <a
          class="text-slate-400 underline-offset-2 hover:text-slate-200 hover:underline"
          href="https://github.com/saberliou/DigitsRecognizer"
          target="_blank"
          rel="noopener"
          >GitHub</a
        >
      </footer>
    </div>
  </body>
</html>
